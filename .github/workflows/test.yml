name: test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    name: validate + unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, zip

      - name: Composer validate
        run: |
          rm -f composer.lock
          composer validate --strict

      - name: Install PHP dependencies
        # Flarum 1.8 requires Flysystem 1.x. Composer 2.10 began blocking
        # advisory-affected legacy dependencies during update by default.
        # This source-validation lane must still resolve the production-pinned
        # Flarum 1 stack; dependency-policy remediation is a separate upgrade.
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: '0'
        run: composer update --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          find src tests extend.php -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Lightweight rollout runner
        run: php tests/run-rollout.php

      - name: PHPUnit
        run: composer test

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Build assets
        working-directory: js
        run: npm run build

      - name: Sync generated dist to feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/forum-social-feed-002')
        run: |
          if ! git diff --quiet -- js/dist/forum.js js/dist/admin.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/dist/forum.js js/dist/admin.js
            git commit -m "build: refresh tracked dist"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: JS unit tests
        run: node --test js/tests/*.test.mjs

      - name: Verify tracked dist is reproducible
        run: git diff --exit-code -- js/dist/forum.js js/dist/admin.js

      - name: Whitespace / conflict markers
        run: git diff --check
