flatrate-discussion-cards:
  admin:
    settings:
      admin_preview_label: Admin preview
      admin_preview_help: >
        Show the new discussion-card presentation to Administrators only.
        Installing or enabling this extension does not turn Admin preview on.
      member_enabled_label: Enable discussion cards for members
      member_enabled_help: >
        Show discussion cards to authenticated non-admin users
        (including moderators who are not Administrators).
        DO NOT ENABLE without new owner authorization.
      guest_enabled_label: Enable discussion cards for guests / public
      guest_enabled_help: >
        Show discussion cards to signed-out visitors.
        DO NOT ENABLE without new owner authorization.
