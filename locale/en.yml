flatrate-discussion-cards:
  admin:
    settings:
      admin_preview_label: Admin preview
      admin_preview_help: >
        Safe live canary. Show discussion cards only to administrators.
        Installing this extension does not enable Admin preview automatically.
      member_enabled_label: Enable cards for members
      member_enabled_help: >
        Show discussion cards to signed-in non-admin members.
        Requires separate owner authorization.
      guest_enabled_label: Enable cards for guests / public
      guest_enabled_help: >
        Show discussion cards to signed-out visitors.
        Requires separate owner authorization.
